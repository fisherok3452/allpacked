<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">

  <title>PackTrail</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- TOP BAR -->
  <header class="topbar">

    <button id="menuBtn" class="menu-button" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div id="topTitle" class="top-title">
      PackTrail
    </div>

    <button id="backBtn" class="back-button hidden" aria-label="Go back">
      ←
    </button>

  </header>


  <!-- APP SCREENS APPEAR HERE -->
  <main id="screen" class="screen"></main>


  <!-- DARK BACKGROUND WHEN MENU IS OPEN -->
  <div id="drawerOverlay" class="drawer-overlay hidden"></div>


  <!-- SIDE MENU -->
  <aside id="drawer" class="drawer">

    <div class="drawer-header">

      <div class="logo">
        P
      </div>

      <div>
        <div class="drawer-title">
          PackTrail
        </div>

        <div class="drawer-subtitle">
          Plan. Pack. Go.
        </div>
      </div>

    </div>


    <nav class="drawer-nav">

      <button data-nav="home">
        Home
      </button>

      <button data-nav="trips">
        My Trips
      </button>

      <button data-nav="gear">
        My Gear
      </button>

      <button data-nav="settings">
        Settings
      </button>

      <button data-nav="about">
        About
      </button>

    </nav>


    <div class="drawer-footer">
      Prototype v0.1
    </div>

  </aside>


  <!-- SMALL NOTIFICATION -->
  <div id="toast" class="toast hidden"></div>

</div>


<script src="app.js"></script>

</body>
</html>
