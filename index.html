<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>AllPacked Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <header class="topbar">

    <button id="menuBtn" class="menu-button" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div id="topTitle" class="top-title">
      AllPacked
    </div>

    <button id="backBtn" class="back-button hidden" aria-label="Go back">
      ←
    </button>

  </header>


  <main id="screen" class="screen"></main>


  <div id="drawerOverlay" class="drawer-overlay hidden"></div>


  <aside id="drawer" class="drawer">

    <div class="drawer-header">

      <div class="logo">
        ✓
      </div>

      <div>

        <div class="drawer-title">
          AllPacked
        </div>

        <div class="drawer-subtitle">
          Plan. Pack. Go.
        </div>

      </div>

    </div>


    <nav class="drawer-nav">

      <button data-nav="home">
        Home
      </button>

      <button data-nav="trips">
        My Trips
      </button>

      <button data-nav="shopping">
        Shopping List
      </button>

      <div class="drawer-divider"></div>

      <button data-nav="settings">
        Settings
      </button>

      <button data-nav="about">
        About
      </button>

    </nav>


    <div class="drawer-footer">
      Prototype v0.21
    </div>

  </aside>


  <div id="modalOverlay" class="modal-overlay hidden"></div>

  <div id="toast" class="toast hidden"></div>

</div>

<script src="app.js"></script>

</body>
</html>
